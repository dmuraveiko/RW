name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build ./cmd/...

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [rw-bot, rw-active-sessions, rw-migrate, rw-demo-active-sessions, rw-demo-telegram-flow, rw-create-invite, rw-fake-topup]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: TARGET=${{ matrix.target }}
          push: false

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/compose.yaml up --build -d
      - run: curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8081/health/ready
      - run: curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8082/health/ready
      - run: make demo-active-sessions
      - run: make demo-telegram-flow
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
